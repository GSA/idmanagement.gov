# GSA Carousel Config 
# Date: 03-22-2023
# File: _data/gsacarousel.yml
# File used in: _includes/hero.html 
# Developer: Clayton Barnette <clayton.barnette@gsa.gov>
# Purpose: Drives Carousel data on the homepage of New IDManagement.gov
#
# - orderNumber: Sequential numbering of each carousel item, starts at 0 - n 
#   initialState: set to active active or leave blank (Note: only one carousel item should be set to active or it breaks the carousel)
#   delay(default: 5000): number of milliseconds to display the carousel item on the page, before changing 
#   heroHeading: text for the main hero section of the carousel, keep text length short 1 - 3 words depending on length
#   heroText: secondary text for the hero section of the carousel, keep text length short as action statements
#   actionButtonText: text displays on hero button, should be no more than 5 words
#   actionLocation: # desired destination of the user after reading action statement, URLs, local URIs or permilinks. Local links (No leading forward slash)
#   actionTarget(default: _blank): target window, options: _blank or _self if link is internal to site 

# Memo: If a link is internal to the site, actionTarget should be set to "_self" if the lint is external or a PDF or Document of somekind, the "_blank" should be used.
# Note: leave the / off the internal urls for 'actionLocation:' 


- orderNumber: 0
  initialState:
  delay: 10000
  heroHeading: FICAM Drives Federal Quantum Readiness
  heroText: Implementing quantum-resistant cryptographic standards that protect digital identities against future quantum computing capabilities.  
  actionButtonText: Learn more about Post Quantum Cryptography
  actionLocation: pqc/
  actionTarget: _blank

- orderNumber: 1
  initialState:
  delay: 10000
  heroHeading: Zero Trust
  heroText: concept assumes there is no implicit trust granted to assets or user accounts based solely on their physical or network location or based on asset ownership.
  actionButtonText: Learn more about Zero Trust
  actionLocation: zero-trust/
  actionTarget: _blank



