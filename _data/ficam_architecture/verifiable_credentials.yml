# FICAM Architecture Layer: Verifiable Credentials
# W3C-standardized cryptographically signed claims enabling portable, privacy-preserving, decentralized identity

id: vc
label: "Verifiable credentials"
isnew: false
ramp: blue
summary: "W3C-standardized cryptographically signed claims enabling portable, privacy-preserving, decentralized identity"

capabilities:
  - name: "W3C VC Data Model 2.0"
    isnew: false
    detail: "JSON-LD and JWT serializations of issuer-signed credential objects; credential status lists (VC Status List 2021) for offline revocation checking without real-time issuer contact."
  
  - name: "SD-JWT"
    isnew: false
    detail: "Selective Disclosure JWT (IETF); holder presents only the specific claims required by the verifier, without revealing the full credential; supports privacy-preserving identity proofing workflows."
  
  - name: "BBS+ signatures"
    isnew: false
    detail: "Unlinkable selective disclosure using multi-message signature scheme; enables zero-knowledge proof of credential possession without issuer correlation across presentations."
  
  - name: "OID4VC / OID4VP"
    isnew: false
    detail: "OpenID for Verifiable Credential Issuance and Presentation; bridges existing OIDC infrastructure with VC wallet model; primary protocol for federal VC issuance and relying party acceptance."
  
  - name: "Decentralized identifiers"
    isnew: false
    detail: "W3C DID Core 1.0; did:web and did:jwk methods for verifiable issuer and holder identification without centralized registry dependency; FPKI-rootable for federal trust."
  
  - name: "Holder-bound authorization"
    isnew: false
    detail: "VC cryptographically bound to holder's authenticator key (FIDO2 or PIV); verifier confirms presenter is legitimate holder; prevents VC theft and replay attacks in access decisions."
  
  - name: "mDL / VC convergence"
    isnew: false
    detail: "ISO 18013-7 aligns mDL presentation protocol with OID4VP; enables mDLs to be carried and presented alongside other VCs in a unified OID4VP-compatible digital wallet."

