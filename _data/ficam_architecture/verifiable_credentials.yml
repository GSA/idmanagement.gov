# FICAM Architecture Layer: Verifiable Credentials
# W3C-standardized cryptographically signed claims enabling portable, privacy-preserving, decentralized identity

id: vc
label: "Verifiable Credentials (VCs)"
isnew: false
status: none
ramp: blue
summary: "Verifiable Credentials (VCs) are tamper-evident, cryptographically signed digital assertions that enable an issuer such as a federal agency, to make claims about a subject in a format that can be independently verified by any relying party without requiring direct contact with the issuer."

capabilities:
  - name: "W3C VC Data Model 2.0"
    isnew: false
    status: none
    detail: "JSON-LD and JWT serializations of issuer-signed credential objects; credential status lists (VC Status List 2021) for offline revocation checking without real-time issuer contact."
  
  - name: "IETF RFC 9901 (SD-JWT)"
    isnew: false
    status: none
    detail: "IETF RFC 9901 introduces Selective Disclosure for JSON Web Tokens (SD-JWT), allowing users to share only specific data fields from a digital credential while hiding others. Issuers replace individual token claims with \"salted hashes\" and provide the cleartext versions separately to the user. This enables the user to select specific information to reveal to a verifier, who can securely authenticate the shared data without seeing the rest."
  
  - name: "BBS Signature Scheme"
    isnew: false
    status: none
    detail: "A digital signing protocol designed to sign a group of multiple messages simultaneously under a single public key. Instead of revealing the entire dataset to a verifier, the holder can use selective disclosure to prove possession of the signature while revealing only a chosen subset of the messages. This is achieved through zero-knowledge proofs, which allow a verifier to mathematically validate the signature's authenticity without ever seeing the hidden data or tracking the user."
  
  - name: "OpenID for Verifiable Credential Issuance (OIDC4VCI)"
    isnew: false
    status: none
    detail: "Defines how a credential issuer (such as a government agency, financial institution, or employer) can deliver verifiable credentials to a digital wallet in a secure and interoperable way."
  
  - name: "OpenID for Verifiable Presentation (OIDC4VP)"
    isnew: false
    status: none
    detail: "Defines a mechanism on top of OAuth 2.0 for requesting and delivering presentations of credentials. Credentials and presentations can be of any format, including, but not limited to W3C Verifiable Credentials Data Model, ISO mdoc, and IETF SD-JWT VC. Is a protocol on top of OAuth 2.0 that enables the presentation of verifiable digital credentials, such as a mDL, and is built upon multiple standardized protocols and data formats."

  - name: "Decentralized Identifiers (DID)"
    isnew: false
    status: none
    detail: "DIDs an identifier that enables verifiable, decentralized digital identity. A DID refers to any subject (e.g., a person, agency). DIDs may be decoupled from centralized registries, identity providers, and certificate authorities. The design enables the controller of a DID to prove control over it without requiring permission from any other party."
  
  - name: "Cryptographic Holder-binding"
    isnew: false
    status: none
    detail: "Ability of the Holder to prove legitimate possession of a Verifiable Credential by proving control over the same private key during the issuance and presentation. The Issuer can enable this binding by including a public key or a reference to a public key that matches to the private key controlled by the Holder."

