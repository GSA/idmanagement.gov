# FICAM Practice Area: Identity Management
# Collect, verify, and manage attributes to establish and maintain enterprise identities

id: identity
label: "Identity"
isnew: false
status: none
ramp: purple
summary: "How an agency collects, verifies, and manages attributes and entitlements to establish and maintain enterprise human identities and NHIs."

capabilities:
  - name: "Identity Proofing (IAL1, IAL2, IAL3)"
    isnew: false
    optional: false
    status: none
    detail: "The processes used to collect, validate, and verify information about a subject to establish assurance in the subject’s claimed identity."
  
  - name: "Attribute management"
    isnew: false
    optional: false
    status: none
    detail: "Attribute management includes orchestrating, validating, and lifecycle-managing the distinctive technical data points and metadata that uniquely define both human users and NHIs."
  
  - name: "Lifecycle Management"
    isnew: true
    optional: false
    status: none
    detail: "Identity Lifecycle Management is the administrative and technical activities required to manage a human digital identity or NHI throughout its lifecycle - creation, modification, and deactivation."
  
  - name: "Mobile Driver License-based Proofing"
    legend_key: mdl
    isnew: false
    optional: false
    status: none
    detail: "ISO 18013-5 compliant mDLs, a cryptographically signed digital credential by a state  DMV and provisioned directly to the holder’s secure device wallet qualifies as SUPERIOR identity evidence (NIST SP 800-63A-4)"

  - name: "Fraud Detection and Mitigation"
    isnew: false
    optional: false
    status: none
    detail: "Fraud Detection involves analyzing access logs for anomalies, applying machine learning to identify fraudulent patterns, requiring phishing-resistant MFA, and deploying deepfake detection tools, with internal reporting hotlines and periodic audits reinforcing compliance. Fraud Mitigation requires revoking compromised account access, notifying authorities, security teams, and affected parties, and deploying incident response teams to analyze breaches and suspend compromised system components."
  
  - name: "FIDO2 device binding"
    legend_key: fido2
    isnew: false
    optional: false
    status: none
    detail: "Authenticator enrollment tied to a proofed enterprise identity; AAGUID-based allowlisting for permitted authenticator models; device attestation records maintained in identity registry."
  
  - name: "VC issuance workflow"
    legend_key: vc
    isnew: false
    optional: false
    status: none
    detail: "Agency acting as VC issuer for employment, role, and entitlement credentials; SD-JWT attribute packaging for selective disclosure; credential bound to holder's enterprise identity."
  
  - name: "Privacy by design"
    isnew: false
    optional: false
    status: none
    detail: "Minimum-necessary data collection at proofing; informed consent management; Privacy Act of 1974 compliance; Privacy Impact Assessment (PIA) requirements for ICAM systems."

  - name: "Identity Evidence"
    isnew: false
    optional: false
    status: none
    detail: "Identity evidence systems."

  - name: "Physical Documents"
    isnew: false
    optional: false
    status: none
    detail: "Physical documents used for identity proofing, such as passports, driver's licenses, and other government-issued identification cards."

  - name: "Electronic Documents"
    isnew: true
    optional: false
    status: none
    detail: "Electronic documents used for identity proofing, such as digital passports, online driver's licenses, and other government-issued digital identification cards."

  - name: "Non-Human Identity enrollment"
    isnew: true
    optional: false
    status: none
    detail: "Enrollment of non-human identities (NHIs) such as IoT devices, service accounts, and software agents; includes proofing, attribute management, and lifecycle management for NHIs."

  - name: "mPIV Enrollment"
    isnew: true
    optional: true
    status: none
    detail: "Enrollment of non-human identities (NHIs) such as IoT devices, service accounts, and software agents; includes proofing, attribute managementifecycle management for NHIs."

  - name: "Verifiable Credentials Issuance"
    isnew: true
    optional: true
    status: none
    detail: "Issuance of verifiable credentials (VCs) for both human and non-human identities; includes proofing, attribute management, and lifecycle management for VCs."

  - name: "Privacy by Design"
    isnew: true
    optional: false
    status: none
    detail: "Privacy by design principles integrated into the development and deployment of identity management systems."

  - name: "Attribute Management"
    isnew: true
    optional: false
    status: none
    detail: "Management of identity attributes across different systems and platforms."

