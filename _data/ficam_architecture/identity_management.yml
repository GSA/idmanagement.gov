# FICAM Practice Area: Identity Management
# Collect, verify, and manage attributes to establish and maintain enterprise identities

id: identity
label: "Identity"
isnew: false
status: none
ramp: purple
summary: "How an agency collects, verifies, and manages attributes and entitlements to establish and maintain enterprise human identities and NHIs."

capabilities:
  - name: "Identity proofing"
    isnew: false
    status: none
    detail: "The processes used to collect, validate, and verify information about a subject to establish assurance in the subject’s claimed identity."
  
  - name: "Attribute management"
    isnew: false
    status: none
    detail: "Attribute management includes orchestrating, validating, and lifecycle-managing the distinctive technical data points and metadata that uniquely define both human users and NHIs."
  
  - name: "Lifecycle management"
    isnew: false
    status: none
    detail: "Identity Lifecycle Management is the administrative and technical activities required to manage a human digital identity or NHI throughout its lifecycle - creation, modification, and deactivation."
  
  - name: "Mobile Driver License-based Proofing"
    isnew: false
    status: none
    detail: "ISO 18013-5 compliant mDLs, a cryptographically signed digital credential by a state  DMV and provisioned directly to the holder’s secure device wallet qualifies as SUPERIOR identity evidence (NIST SP 800-63A-4)"

  - name: "Fraud Detection and Mitigation"
    isnew: false
    status: none
    detail: "Fraud Detection involves implementing comprehensive surveillance and monitoring techniques to identify unusual or unauthorized activities. This includes analyzing system access logs for anomalies, utilizing advanced analytics and machine learning tools to detect patterns indicative of fraud, and employing phishing resistant multi-factor authentication. Agencies should also incorporate deepfake detection tools that analyze video and audio for inconsistencies that may indicate manipulation. Establishing internal hotlines for reporting suspicious activities and regularly auditing identity management systems to ensure compliance with security protocols are also crucial steps.
    
    Fraud Mitigation includes immediately revoking access to compromised accounts, contacting relevant authorities and internal security teams, and notifying potentially affected individuals or departments. Agencies should deploy incident response teams to perform a comprehensive analysis of the breach and implement temporary measures such as suspending system components involved in the fraud."
  
  - name: "FIDO2 device binding"
    isnew: false
    status: none
    detail: "Authenticator enrollment tied to a proofed enterprise identity; AAGUID-based allowlisting for permitted authenticator models; device attestation records maintained in identity registry."
  
  - name: "mPIV enrollment"
    isnew: false
    status: none
    detail: "FIPS 201-3 compliant enrollment on mobile secure element; in-person biometric capture at initial enrollment; remote re-enrollment for existing PIV holders using on-file biometric."
  
  - name: "VC issuance workflow"
    isnew: false
    status: none
    detail: "Agency acting as VC issuer for employment, role, and entitlement credentials; SD-JWT attribute packaging for selective disclosure; credential bound to holder's enterprise identity."
  
  - name: "Privacy by design"
    isnew: false
    status: none
    detail: "Minimum-necessary data collection at proofing; informed consent management; Privacy Act of 1974 compliance; Privacy Impact Assessment (PIA) requirements for ICAM systems."

