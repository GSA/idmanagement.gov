  - name: "VC-based authorization"
    isnew: false
    status: none
    detail: "The holder presents a VC to the resource server; the verifier validates the issuer's signature offline and applies fine-grained ABAC using structured entitlement claims, with no real-time issuer query required."
  
  - name: "Digital services / SSO"
    isnew: false
    status: none
    detail: "An authentication process by which one account and its authenticators are used to access multiple applications in a seamless manner, generally implemented with a federation protocol."

