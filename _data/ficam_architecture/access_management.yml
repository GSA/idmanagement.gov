# FICAM Practice Area: Access Management
# Authenticate identities and enforce authorization policies for logical and physical access

id: access
label: "Access"
isnew: false
status: none
ramp: blue
summary: "The set of practices that enables only those permitted the ability to perform an action on a particular resource. The three most common Access Management services you encounter every day perhaps without realizing it are: Policy Administration, Authentication, and Authorization."

capabilities:
  - name: "Authentication"
    isnew: false
    status: none
    detail: "Verifying the identity of a human or NHI user, process, or device, often as a prerequisite to allowing access to resources in an information system"
  
  - name: "Authorization"
    isnew: false
    status: none
    detail: "The right or a permission that is granted to a system entity to access a system resource."
  
  - name: "Privileged Access Management (PAM)"
    isnew: false
    status: none
    detail: "Monitoring, controlling and auditing the use of privileged accounts which include local and domain administrative accounts, emergency accounts, application management, and service accounts. Privilege accounts provide elevated, often nonrestricted, access to IT resources and technology."
  
  - name: "Physical Access Systems (PACS)"
    isnew: false
    status: none
    detail: "a collection of technologies that control physical access at one or more federal agency sites by electronically authenticating employees, contractors, and visitors."
  
  - name: "mPIV authentication"
    isnew: false
    status: none
    detail: "Performed using hardware-backed cryptographic keys and PKI certificates stored within a mobile digital wallet. Relying parties (agencies) verify these credentials via remote online protocols or local wireless connections, e.g., NFC or BLE after the user approves the transaction using a PIN or biometrics."
  
  - name: "FIDO2 authentication"
    isnew: false
    status: none
    detail: "FIDO2 is phishing resistant MFA based on public key cryptography combining WebAuthn and the FIDO Alliance's Client to Authenticator Protocol (CTAP2) standard."

  ## RECOMMEND REMOVING THIS ALTOGETHER.  We can include in narrative in the PQC section. -- cjb
