    isnew: false
    status: none
  - title: "FIPS 140-3"
    link: "https://csrc.nist.gov/pubs/fips/140-3/final"
    description: "Security requirements for cryptographic modules used to protect keys and cryptographic operations."
    isnew: false
    status: none
  - title: "ISO 18013-5"
    link: "https://www.iso.org/standard/69084.html"
