# FICAM Practice Area: Credential Management
# Issue, manage, and revoke credentials bound to verified enterprise identities

id: credential
label: "Credential management"
ramp: coral
summary: "Issue, manage, and revoke credentials bound to verified enterprise identities"

capabilities:
  - name: "PIV / CAC"
    detail: "FIPS 201-3 smart card with PIV Authentication, Card Authentication, digital signature, and encryption certificates; FPKI-chained; mandatory for federal employees and contractors."
  
  - name: "PIV-I / derived PIV"
    detail: "PIV-Interoperable for non-federal entities; derived PIV credential on mobile per SP 800-157r1; supports AAL2 and AAL3 without a physical smart card."
  
  - name: "mPIV"
    detail: "FIPS 201-3 PIV credential on mobile device's secure element or TEE; NFC tap and BLE proximity presentation; device-bound biometric cardholder verification method (CVM)."
  
  - name: "FIDO2 / passkeys"
    detail: "Hardware security keys meeting AAL3 (YubiKey, Titan); platform passkeys meeting AAL2 (Windows Hello, Apple, Google); no shared secrets; private key never leaves the authenticator."
  
  - name: "mDL"
    detail: "ISO/IEC 18013-5 state-issued credential on mobile device; NFC and QR presentation; device authentication; selective attribute disclosure; REAL ID-compliant when issued under DHS/TSA waiver."
  
  - name: "PQC credentials"
    detail: "Credentials issued with ML-DSA signing keys and ML-KEM key encapsulation; hybrid classical+PQC during transition period; crypto-agile issuance infrastructure supporting future algorithm rotation."
  
  - name: "Verifiable credentials"
    detail: "W3C VC-format employment, role, and entitlement claims; SD-JWT packaging; holder-controlled presentation; revocation via VC Status List without real-time issuer query."
  
  - name: "PKI / FPKI"
    detail: "Federal PKI Shared Service Provider (SSP) program; FPKI Common Policy CA chain; CRL and OCSP revocation services; cross-certification with external trust anchors."

standards:
  - "FIPS 201-3"
  - "NIST SP 800-157r1"
  - "FIPS 140-3"
  - "ISO 18013-5"
  - "NIST FIPS 203/204"
  - "W3C VC DM 2.0"
  - "NIST SP 800-63B"

documents:
  - mdl
  - fido2
  - mpiv
  - pqc
  - vc
