<link rel="stylesheet" href="{{ '/assets/fpki-graph/page-context.css' | relative_url }}">
<dialog open class="fpki-graph-shell" id="fpki-graph-shell" aria-labelledby="fpki-graph-title">
  <div class="fpki-graph-bar">
    <strong id="fpki-graph-title">Certificate relationships</strong>
    <button type="button" id="fpki-expand" aria-expanded="false" aria-controls="fpki-map-frame">Expand graph ↗</button>
  </div>
  <iframe id="fpki-map-frame"
    src="{{ '/fpki/graph/' | relative_url }}"
    data-widget-src="{{ '/fpki/graph/' | relative_url }}"
    title="Certification authorities and their connections"
    width="100%" height="700" loading="eager"></iframe>
</dialog>
<script src="{{ '/assets/fpki-graph/page-context.js' | relative_url }}" defer></script>
