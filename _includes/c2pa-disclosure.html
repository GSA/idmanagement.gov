{% if site.c2pa.enabled %}
<section class="c2pa-dropdown" id="c2pa-image-modal" role="dialog" aria-modal="false" aria-labelledby="c2pa-dialog-title" popover="manual" hidden>
  <div class="c2pa-dropdown__header">
    <img class="c2pa-dropdown__icon" src="{{site.baseurl}}/assets/c2pa/content-credentials-icon.svg" width="28" height="28" alt="" aria-hidden="true">
    <h2 id="c2pa-dialog-title">Content Credentials</h2>
    <button class="c2pa-dropdown__close" type="button" aria-label="Close Content Credentials">
      <svg class="usa-icon" aria-hidden="true" focusable="false"><use href="{{site.baseurl}}/assets/img/sprite.svg#close"></use></svg>
    </button>
  </div>
  <div id="c2pa-dialog-content" aria-live="polite"></div>
  <div class="c2pa-dropdown__footer">
    <a id="c2pa-inspect-link" class="usa-button usa-link--external" target="_blank" rel="noopener noreferrer">View more in Adobe Inspect (L3)</a>
  </div>
</section>
{% endif %}
