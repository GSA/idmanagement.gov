# This workflow uses the CodeQL Action to analyze code for vulnerabilities.
# Learn more about CodeQL: https://codeql.github.com/
# This workflow runs the latest ubuntu-latest runner, and supports ruby4 and node 24.x codebases. 
# If you need to support other languages, you can add them to the matrix below.
#
# Update: 11/19/2026: merged setting from two separate codeql files that ran, updated to latest codeql format - cjb

on:
  # Scan pushes to the staging and production branches.
  push:
    branches: [ "staging", "federalist-pages" ]
  # Scan proposed changes targeting staging.
  pull_request:
    branches: [ "staging" ]
  # Scan the default branch every Sunday at 03:19 UTC.
  schedule:
    - cron: '19 3 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Upload code scanning results.
      security-events: write
      # Allow access to internal or private CodeQL packs.
      packages: read
      # Retain Actions read access for CodeQL in private repositories.
      actions: read
      # Check out the repository source.
      contents: read

    strategy:
      # Let each language scan finish even if another fails.
      fail-fast: false
      matrix:
        # These languages support CodeQL analysis without a build.
        include:
          - language: javascript-typescript
            build-mode: none
          - language: ruby
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # Keep results for each language in a separate analysis category.
          category: "/language:${{matrix.language}}"
