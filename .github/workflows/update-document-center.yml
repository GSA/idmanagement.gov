name: Update Document Center index

on:
  push:
    paths:
      - "docs/**"
      - "scripts/generate-document-center.rb"
      - ".github/workflows/update-document-center.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: document-center-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.3'
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Install document metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils unzip

      - name: Generate Document Center index
        run: ruby scripts/generate-document-center.rb

      - name: Validate generated index
        run: |
          ruby -rjson -e 'JSON.parse(File.read("assets/data/document-center.json"))'
          git diff --check

      - name: Updateing IDManagement Doc Center
        id: doc-center-build
        run: |
          echo "Updateing IDManagement Doc Center"
          if npm run build && test -s _site/doccenter/index.html && test -s _site/doccenter/help/index.html && test -s _site/assets/data/document-center.json; then
            echo "::notice::IDManagement Doc Center built successfully."
          else
            echo "::error::IDManagement Doc Center build failed. Review the build output above."
            exit 1
          fi

      - name: Commit updated index
        env:
          INDEX_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- assets/data/document-center.json; then
            echo "Document Center index is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/data/document-center.json
          git commit -m "Update Document Center index"
          # A newer push may arrive while metadata is being extracted. Rebuild
          # from that head instead of overwriting it or publishing a stale index.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${INDEX_BRANCH}"; then
              exit 0
            fi
            git fetch origin "$INDEX_BRANCH"
            git reset --hard FETCH_HEAD
            ruby scripts/generate-document-center.rb
            ruby -rjson -e 'JSON.parse(File.read("assets/data/document-center.json"))'
            git diff --check
            echo "Updateing IDManagement Doc Center (push retry $attempt)"
            if npm run build && test -s _site/doccenter/index.html && test -s _site/doccenter/help/index.html && test -s _site/assets/data/document-center.json; then
              echo "::notice::IDManagement Doc Center retry build succeeded."
            else
              echo "::error::IDManagement Doc Center retry build failed."
              exit 1
            fi
            if git diff --quiet -- assets/data/document-center.json; then
              exit 0
            fi
            git add -- assets/data/document-center.json
            git commit -m "Update Document Center index"
          done
          echo "Could not publish the index after three attempts."
          exit 1

      - name: Report IDManagement Doc Center result
        if: always()
        env:
          BUILD_RESULT: ${{ steps.doc-center-build.outcome }}
          JOB_RESULT: ${{ job.status }}
        run: |
          echo "IDManagement Doc Center build: $BUILD_RESULT; workflow job: $JOB_RESULT"
          {
            echo "## Updateing IDManagement Doc Center"
            echo ""
            echo "Build result: **$BUILD_RESULT**"
            echo ""
            echo "Workflow job result: **$JOB_RESULT**"
            echo ""
            echo "A skipped build means an earlier step prevented it from running. Review failed steps for error details."
          } >> "$GITHUB_STEP_SUMMARY"
